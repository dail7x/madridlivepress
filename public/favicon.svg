<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="100" height="100" rx="24" fill="#090a0f"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Geometric "N" Monogram for Noche Madrid -->
  <!-- Left Pillar -->
  <rect x="25" y="26" width="10" height="48" rx="2" fill="#FAFAFA"/>
  
  <!-- Diagonal Beam -->
  <path d="M25 26 L65 74 L75 74 L35 26 Z" fill="#FAFAFA"/>
  
  <!-- Right Pillar -->
  <rect x="65" y="26" width="10" height="48" rx="2" fill="#FAFAFA"/>

  <!-- Live Press Red Signal Dot at top right -->
  <circle cx="79" cy="22" r="7" fill="url(#redGrad)"/>
  <circle cx="79" cy="22" r="11" fill="none" stroke="#F43F5E" stroke-width="1.5" opacity="0.4"/>
</svg>
